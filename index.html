<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SoundScape — A premium web-based music player with playlist, visualizer, and elegant dark UI." />
  <title>SoundScape — Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- Ambient background -->
  <div class="ambient-bg" id="ambient-bg" aria-hidden="true"></div>

  <main class="app">
    <!-- ═══════ Player Card ═══════ -->
    <section class="player" id="player" aria-label="Music Player">

      <!-- Album Art -->
      <div class="album-art-wrap" id="album-art-wrap">
        <img class="album-art" id="album-art" src="assets/album_neon_dreams.png" alt="Album cover" />
        <div class="album-glow" id="album-glow"></div>
        <!-- Vinyl disc peek -->
        <div class="vinyl" id="vinyl">
          <div class="vinyl-label"></div>
        </div>
      </div>

      <!-- Song Info -->
      <div class="song-info">
        <h1 class="song-title" id="song-title">Neon Dreams</h1>
        <p class="song-artist" id="song-artist">Synthwave Collective</p>
      </div>

      <!-- Progress -->
      <div class="progress-section">
        <span class="time time-current" id="time-current">0:00</span>
        <div class="progress-bar-wrap" id="progress-bar-wrap" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-bar" id="progress-bar"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <span class="time time-total" id="time-total">0:00</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn ctrl-small" id="btn-shuffle" aria-label="Shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="ctrl-btn ctrl-medium" id="btn-prev" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="btn-play" aria-label="Play" title="Play">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-medium" id="btn-next" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-small" id="btn-repeat" aria-label="Repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume-section">
        <button class="vol-icon-btn" id="btn-mute" aria-label="Mute" title="Mute/Unmute">
          <svg class="icon-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <svg class="icon-vol-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <div class="volume-bar-wrap" id="volume-bar-wrap" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
          <div class="volume-bar" id="volume-bar"></div>
          <div class="volume-thumb" id="volume-thumb"></div>
        </div>
      </div>
    </section>

    <!-- ═══════ Playlist Panel ═══════ -->
    <aside class="playlist-panel" id="playlist-panel" aria-label="Playlist">
      <div class="playlist-header">
        <h2 class="playlist-title">Playlist</h2>
        <div class="playlist-controls">
          <label class="autoplay-toggle" title="Autoplay next track">
            <input type="checkbox" id="chk-autoplay" checked />
            <span class="toggle-track"><span class="toggle-knob"></span></span>
            <span class="toggle-label">Autoplay</span>
          </label>
        </div>
      </div>
      <ul class="playlist" id="playlist" role="list">
        <!-- Populated by JS -->
      </ul>
      <div class="playlist-footer">
        <span id="playlist-count">5 tracks</span>
        <span id="playlist-duration"></span>
      </div>
    </aside>
  </main>

  <script src="player.js"></script>
</body>
</html>
